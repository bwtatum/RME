<!--
visits/templates/visits/base.html

Base layout for all pages inside the Vendor Visit Calendar app.

Provides:
- Header navigation
- Auth status
- Layout consistency
- Extendable content block

All future app pages should extend this template.
-->

<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vendor Visit Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: system-ui;
            margin: 0;
            background: #f5f6f8;
        }

        header {
            background: black;
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-right: 16px;
        }

        .container {
            padding: 24px;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: black;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <strong style="margin-right: 24px;">Vendor Calendar</strong>

    <a href="{% url 'calendar' %}">Calendar</a>
    <a href="{% url 'visit_create' %}">New Visit</a>

    <div style="margin-left:auto;">
        Logged in as {{ user.username }}
        |
        <a href="{% url 'logout' %}">Logout</a>
    </div>
</header>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
