<!--
templates/registration/login.html

Login page for Vendor Visit Calendar.
Uses Django built-in authentication system.
-->

<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Login - Vendor Visit Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: system-ui;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f4f4f4;
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: black;
            color: white;
            font-weight: 600;
        }
        .errorlist {
            color: red;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Vendor Calendar Login</h2>

    {% if form.errors %}
        <p style="color:red;">Invalid username or password.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.username.label_tag }}
        {{ form.username }}

        {{ form.password.label_tag }}
        {{ form.password }}

        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
